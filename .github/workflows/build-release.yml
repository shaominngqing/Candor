name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Check Swift formatting
        run: swift format lint --configuration .swift-format --recursive Sources Tests Package.swift

      - name: Run tests
        env:
          NSUnbufferedIO: "YES"
        run: swift test --verbose

      - name: Validate bundle metadata
        run: |
          set -euo pipefail
          plutil -lint AppResources/Info.plist
          plutil -lint AppResources/PrivacyInfo.xcprivacy
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' AppResources/Info.plist)" = "Candor"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' AppResources/Info.plist)" = "io.github.shaominngqing.candor"

      - name: Build app bundle
        run: ./Scripts/build-app.sh

      - name: Verify architecture and signature
        run: |
          set -euo pipefail
          file "dist/Candor.app/Contents/MacOS/Candor" | grep -q "${{ matrix.arch }}"
          codesign --verify --deep --strict --verbose=2 "dist/Candor.app"

      - name: Package DMG and ZIP
        id: package
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" AppResources/Info.plist)
          ./Scripts/package-release.sh "${{ matrix.arch }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Candor-${{ steps.package.outputs.version }}-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v8
        with:
          pattern: Candor-*
          path: release
          merge-multiple: true

      - name: Verify release checksums
        run: |
          set -euo pipefail
          cd release
          for checksum in *.sha256; do
            shasum -a 256 -c "$checksum"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Candor ${GITHUB_REF_NAME#v}"
