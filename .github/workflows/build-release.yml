name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "${{ matrix.arch }}"
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK ${sdk_version}"
          test "${sdk_version%%.*}" -ge 26

      - name: Check Swift formatting
        run: |
          swift format lint --strict --configuration .swift-format --recursive Sources Tests Package.swift
          swift format lint --strict --configuration .swift-format Scripts/render-dmg-background.swift

      - name: Check release scripts
        run: |
          zsh -n Scripts/build-app.sh Scripts/package-release.sh Scripts/generate-appcast.sh
          osacompile -o "$RUNNER_TEMP/CandorDMGLayout.scpt" Scripts/layout-dmg.applescript

      - name: Run tests
        env:
          NSUnbufferedIO: "YES"
        run: swift test --verbose

      - name: Validate bundle metadata
        run: |
          set -euo pipefail
          plutil -lint AppResources/Info.plist
          plutil -lint AppResources/PrivacyInfo.xcprivacy
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' AppResources/Info.plist)" = "Candor"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' AppResources/Info.plist)" = "io.github.shaominngqing.candor"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' AppResources/Info.plist)"
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' AppResources/Info.plist | grep -q 'appcast-__CANDOR_ARCH__\.xml$'

      - name: Build app bundle
        run: ./Scripts/build-app.sh

      - name: Verify architecture and signature
        run: |
          set -euo pipefail
          executable="dist/Candor.app/Contents/MacOS/Candor"
          file "$executable" | grep -q "${{ matrix.arch }}"
          binary_sdk=$(otool -l "$executable" | awk '
            $1 == "cmd" && $2 == "LC_BUILD_VERSION" { reading = 1; next }
            reading && $1 == "sdk" { print $2; exit }
          ')
          echo "Linked macOS SDK ${binary_sdk}"
          test "${binary_sdk%%.*}" -ge 26
          test -d "dist/Candor.app/Contents/Frameworks/Sparkle.framework"
          otool -L "$executable" | grep -q '@rpath/Sparkle.framework'
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' dist/Candor.app/Contents/Info.plist)" = \
            "https://github.com/shaominngqing/Candor/releases/latest/download/appcast-${{ matrix.arch }}.xml"
          codesign --verify --deep --strict --verbose=2 "dist/Candor.app"

      - name: Package DMG and ZIP
        id: package
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" AppResources/Info.plist)
          ./Scripts/package-release.sh "${{ matrix.arch }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate signed update feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            ./Scripts/generate-appcast.sh "${{ matrix.arch }}" "$GITHUB_REF_NAME" -

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Candor-${{ steps.package.outputs.version }}-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v8
        with:
          pattern: Candor-*
          path: release
          merge-multiple: true

      - name: Verify release checksums
        run: |
          set -euo pipefail
          cd release
          for checksum in *.sha256; do
            shasum -a 256 -c "$checksum"
          done
          for architecture in arm64 x86_64; do
            test -f "appcast-${architecture}.xml"
            grep -q 'sparkle:edSignature=' "appcast-${architecture}.xml"
            grep -q 'sparkle-signatures:' "appcast-${architecture}.xml"
            grep -q "Candor-.*-macOS-${architecture}.zip" "appcast-${architecture}.xml"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Candor ${GITHUB_REF_NAME#v}"
